[package]
name = "symir"
description = "Symbolic interpreter over the printed PyPTO IR: extracts a DAG of symbolic tasks with uninterpreted bounded loop variables"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pypto-ir = { path = "../pypto-ir" }
petgraph = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[[bin]]
name = "symir"
path = "src/main.rs"
